[project]
name = "mac-oui-lookup-kit"
version = "0.1.0"
description = "Look up the hardware vendor for a MAC address using built-in or custom OUI data."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
